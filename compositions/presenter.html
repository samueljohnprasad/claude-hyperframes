<html lang="en">

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />

    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body, #presenter {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: transparent;
      }
      #presenter-rig {
        position: absolute;
        left: 430px;
        top: 1170px;
        width: 650px;
        height: 750px;
        transform-origin: 325px 750px;
      }
      .outline {
        stroke: #302018;
        stroke-width: 6;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
    </style>
  </head>

          <line x1="370" y1="500" x2="370" y2="600" class="outline" stroke="#FBFAF8" stroke-width="4" />

          <g id="head-anchor" transform="translate(0, 0)">

            <rect x="290" y="400" width="70" height="80" fill="#E8B896" class="outline" />
