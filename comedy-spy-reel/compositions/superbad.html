<script>/* Original deterministic cut-paper sets, inspired by the supplied style grammar. */
window.DramaPaper = (() => {

  const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
  const ease=x=>1-(1-clamp(x))**3;
  const paths=new Map();
